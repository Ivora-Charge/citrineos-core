# Local-only override for the LAN test stack (csms-test). Not for commit upstream.
# Secrets live in the gitignored ./.env and are interpolated here as ${VAR}; nothing
# secret may be a literal in this tracked file (history of this file leaked live
# values in 2026; see docs/identity-consolidation-plan.md section 2).
services:
  citrine:
    image: citrineos-server:local
    pull_policy: never
    build:
      context: .
      dockerfile: ./apps/ocpp-server/deploy.Dockerfile
    # Sequelize's default pool of 5 crashes the server under ~8 concurrent
    # charging sessions (pressure test 2026-07-06). Mirrors deploy/docker-compose.yml.
    environment:
      BOOTSTRAP_CITRINEOS_DATABASE_POOL_MAX: "30"
      BOOTSTRAP_CITRINEOS_DATABASE_POOL_MIN: "5"
      BOOTSTRAP_CITRINEOS_DATABASE_POOL_ACQUIRE: "30000"
    # Everything on loopback: host nginx proxies 8080 (core REST), 8081 (OCPP
    # wss) and the UI; 8082-8083/8443-8444 are the SP1/SP2 listeners (fronted by
    # nginx in Phase 4.6); 9229 is the Node inspector port.
    ports: !override
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
      - "127.0.0.1:9229:9229"

  citrineos-ocpi:
    ports: !override
      - "127.0.0.1:8085:8085"

  amqp-broker:
    ports: !override
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:5672:5672"

  ocpp-db:
    ports: !override
      - "127.0.0.1:5432:5432"

  minio:
    ports: !override
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  # Hasura lockdown (multi-tenant rollout Phase 2): admin secret for server-side
  # privileged access, JWT mode against Supabase Auth for everyone else.
  # claims_map reads this box's OWN subtree of the per-environment claims
  # (app_metadata.csms.test.*), so a grant written for production never applies
  # here and vice versa; see docs/identity-consolidation-plan.md 2.1.
  # ($$ = compose-escaped literal $ in the JSONPath expressions.)
  # Row-level permissions live in apps/ocpp-server/hasura-metadata (re-applied
  # from the mounted dir on every container start).
  graphql-engine:
    ports: !override
      - "127.0.0.1:8090:8080"
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?missing from citrineos-core/.env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"https://uoatfgdxafvetninytuu.supabase.co/auth/v1/.well-known/jwks.json","issuer":"https://uoatfgdxafvetninytuu.supabase.co/auth/v1","audience":"authenticated","claims_map":{"x-hasura-allowed-roles":{"path":"$$.app_metadata.csms.test.roles"},"x-hasura-default-role":"tenant-viewer","x-hasura-user-id":{"path":"$$.sub"},"x-hasura-tenant-id":{"path":"$$.app_metadata.csms.test.tenant_id","default":""}}}'

  citrine-ui:
    image: citrineos-operator-ui:local
    pull_policy: never
    ports: !override
      - "127.0.0.1:3000:3000"
    extra_hosts:
      # Lets the server reach the host-run payment uvicorn on :9010 regardless
      # of the compose subnet.
      - 'host.docker.internal:host-gateway'
    build:
      context: .
      dockerfile: apps/operator-ui/Dockerfile
      args:
        # Baked into the client bundle at build time (see Dockerfile). Same-origin
        # paths that nginx proxies to Hasura; core REST is reached only through
        # the session- and role-gated Next.js route handler /api/core.
        NEXT_PUBLIC_API_URL: https://csms-test.ivoracharge.com/hasura/v1/graphql
        NEXT_PUBLIC_WS_URL: wss://csms-test.ivoracharge.com/hasura/v1/graphql
        NEXT_PUBLIC_CITRINE_CORE_URL: /api/core
        NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://host.docker.internal:9010
        NEXT_PUBLIC_AUTH_PROVIDER: supabase
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?missing from citrineos-core/.env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?missing from citrineos-core/.env}
    environment:
      # Which subtree of app_metadata.csms this box reads (server-only).
      CSMS_ENV: ${CSMS_ENV:?missing from citrineos-core/.env}
      # Server-side calls to core never traverse the public edge.
      CITRINE_CORE_INTERNAL_URL: http://citrine:8080
      # Server-only shared secret for the payment catalog/connect/stats endpoints.
      PAYMENT_CATALOG_SYNC_SECRET: ${PAYMENT_CATALOG_SYNC_SECRET:?missing from citrineos-core/.env}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://host.docker.internal:9010
      NEXT_PUBLIC_AUTH_PROVIDER: supabase
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      # Server-only: user invites and claims writes (GoTrue admin API).
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?missing from citrineos-core/.env}
      # Invites land on the analytics set-password screen (Supabase Site URL).
      ANALYTICS_URL: https://analytics.ivoracharge.com
      # Server-side privileged Hasura access (syncTariffToPayment etc.). Never
      # handed to the browser under the supabase provider.
      HASURA_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?missing from citrineos-core/.env}
      # Must be the public URL or NextAuth callbacks/cookies break.
      NEXTAUTH_URL: https://csms-test.ivoracharge.com
      NEXT_PUBLIC_API_URL: https://csms-test.ivoracharge.com/hasura/v1/graphql
      NEXT_PUBLIC_WS_URL: wss://csms-test.ivoracharge.com/hasura/v1/graphql
      NEXT_PUBLIC_CITRINE_CORE_URL: /api/core
      # The upstream base compose seeds the dev 'generic' provider credentials; blank
      # them here (config.ts also refuses the generic provider in production).
      NEXT_PUBLIC_ADMIN_EMAIL: ""
      ADMIN_PASSWORD: ""
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      GOOGLE_MAPS_ADDRESS_API_KEY: ${GOOGLE_MAPS_ADDRESS_API_KEY}
