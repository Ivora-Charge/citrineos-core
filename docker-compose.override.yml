# Local-only override: the published ghcr.io operator-ui image is not publicly
# pullable, so build the UI from local source instead (same Dockerfile that
# docker-compose.local.yml uses). Not for commit upstream.
services:
  # Build the server from local source too: the published :latest image lags the
  # repo (missing migrations >= 20260427, e.g. ocppConnectionName rename) and the
  # locally-built operator UI queries the newer schema.
  citrine:
    image: citrineos-server:local
    pull_policy: never
    build:
      context: .
      dockerfile: ./apps/ocpp-server/deploy.Dockerfile
    # Sequelize's default pool of 5 crashes the server under ~8 concurrent
    # charging sessions (pressure test 2026-07-06: acquire-timeout storm ->
    # process death -> fleet-wide disconnect). 30 rides out fleet bursts.
    # Mirrors deploy/docker-compose.yml.
    environment:
      BOOTSTRAP_CITRINEOS_DATABASE_POOL_MAX: "30"
      BOOTSTRAP_CITRINEOS_DATABASE_POOL_MIN: "5"
      BOOTSTRAP_CITRINEOS_DATABASE_POOL_ACQUIRE: "30000"

  # Hasura lockdown (multi-tenant rollout Phase 2): admin secret for server-side
  # privileged access, JWT mode against the ivora Keycloak realm for everyone
  # else. claims_map derives the Hasura session from the plain Keycloak token:
  # allowed roles from the citrineos-ui client roles, tenant from the tenant_id
  # user attribute. No unauthorized role => anonymous requests are rejected.
  # ($$ = compose-escaped literal $ in the JSONPath expressions.)
  # Row-level permissions live in apps/ocpp-server/hasura-metadata (re-applied from
  # the mounted dir on every container start); derive them with
  # hasura/apply-tenancy-permissions.py.
  graphql-engine:
    environment:
      HASURA_GRAPHQL_ADMIN_SECRET: "11b7e5994bac687366949358fa4308624a3808a24321ef4d"
      HASURA_GRAPHQL_JWT_SECRET: '{"jwk_url":"http://keycloak:8180/auth/realms/ivora/protocol/openid-connect/certs","issuer":"https://csms-test.ivoracharge.com/auth/realms/ivora","claims_map":{"x-hasura-allowed-roles":{"path":"$$.resource_access.citrineos-ui.roles"},"x-hasura-default-role":"tenant-viewer","x-hasura-user-id":{"path":"$$.sub"},"x-hasura-tenant-id":{"path":"$$.tenant_id","default":""}}}'

  # Identity provider for the operator UI (and, in Phase 2, Hasura JWT auth).
  # Realm `ivora` is imported declaratively from ./keycloak/ivora-realm.json on
  # first boot; run ./keycloak/bootstrap.sh once afterwards to allow the
  # unmanaged tenant_id user attribute (Keycloak >=24 strips it otherwise).
  # Public URL: https://csms-test.ivoracharge.com/auth (nginx proxies /auth/ ->
  # 127.0.0.1:8180; see setup-scripts/setup_nginx_csms_ssl.sh in the parent
  # repo). The fixed --hostname keeps token issuers on the public URL even for
  # backchannel calls from the UI container (http://keycloak:8180/auth).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --http-port=8180
      - --http-relative-path=/auth
      - --hostname=https://csms-test.ivoracharge.com/auth
      - --proxy-headers=xforwarded
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "Zrx3Oa2mtXLFd8sbFOYh"
    ports:
      - 8180:8180
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  citrine-ui:
    image: citrineos-operator-ui:local
    pull_policy: never
    extra_hosts:
      # Resolves to this container's bridge gateway regardless of subnet;
      # lets the server reach the host-run payment uvicorn on :9010.
      - 'host.docker.internal:host-gateway'
    build:
      context: .
      dockerfile: apps/operator-ui/Dockerfile
      args:
        # Baked into the client bundle at build time (see Dockerfile). The
        # browser hits these same-origin paths, which nginx proxies to Hasura
        # (:8090) and core (:8080). Same origin => no CORS.
        NEXT_PUBLIC_API_URL: https://csms-test.ivoracharge.com/hasura/v1/graphql
        NEXT_PUBLIC_WS_URL: wss://csms-test.ivoracharge.com/hasura/v1/graphql
        NEXT_PUBLIC_CITRINE_CORE_URL: https://csms-test.ivoracharge.com/core-api
        # Payment service base URL used (server-side) by the catalog sync action.
        # host.docker.internal is pinned to the bridge gateway via extra_hosts
        # (host-gateway) -> host:9010 (payment service); a literal gateway IP
        # broke when the compose network was recreated on a new subnet
        # (172.18 -> 172.20, overview hung on payment calls). NEXT_PUBLIC_* must
        # be a build arg so Next inlines it. Public alt: https://payment-test.ivoracharge.com
        NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://host.docker.internal:9010
        # Keycloak login (multi-tenant rollout Phase 1). Both are inlined into
        # the client bundle: the auth provider choice and the public URL the
        # browser is redirected to for login.
        NEXT_PUBLIC_AUTH_PROVIDER: keycloak
        NEXT_PUBLIC_KEYCLOAK_URL: https://csms-test.ivoracharge.com/auth
    environment:
      # Server-only shared secret for /api/catalog/sync (read at runtime by the
      # syncPaymentCatalog server action). Must match the payment service's
      # PAYMENT_CATALOG_SYNC_SECRET. Never baked into the client bundle.
      PAYMENT_CATALOG_SYNC_SECRET: "e2e-test-secret"
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: http://host.docker.internal:9010
      # Keycloak login (multi-tenant rollout Phase 1). The browser uses the
      # public /auth URL; this container reaches Keycloak directly over the
      # compose network for token/userinfo/jwks calls.
      NEXT_PUBLIC_AUTH_PROVIDER: keycloak
      NEXT_PUBLIC_KEYCLOAK_URL: https://csms-test.ivoracharge.com/auth
      KEYCLOAK_SERVER_URL: http://keycloak:8180/auth
      KEYCLOAK_REALM: ivora
      KEYCLOAK_CLIENT_ID: citrineos-ui
      KEYCLOAK_CLIENT_SECRET: "f21744f52399128c0358c4fe2f45dfb176494342adc1ed2e"
      # Server-side privileged Hasura access (syncTariffToPayment etc.). With
      # AUTH_PROVIDER=keycloak this secret is never handed to the browser --
      # getHasuraAdminSecretAction returns empty and the client authenticates
      # with its own Bearer token + x-hasura-role instead.
      HASURA_ADMIN_SECRET: "11b7e5994bac687366949358fa4308624a3808a24321ef4d"
      # Keycloak Admin API credentials (server-only), used by the tenant user
      # invite/list server actions (Phase 3).
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: "Zrx3Oa2mtXLFd8sbFOYh"
      # Generic auth provider credentials (unused while AUTH_PROVIDER=keycloak;
      # kept for quick local fallback)
      NEXT_PUBLIC_ADMIN_EMAIL: admin@citrineos.com
      ADMIN_PASSWORD: "CitrineOS!"
      NEXTAUTH_SECRET: "local-dev-secret-2b1fc16ee76818bf"
      # Must be the public URL or NextAuth callbacks/cookies break.
      NEXTAUTH_URL: https://csms-test.ivoracharge.com
      # Also provided at runtime for any server-side reads of the same config.
      NEXT_PUBLIC_API_URL: https://csms-test.ivoracharge.com/hasura/v1/graphql
      NEXT_PUBLIC_WS_URL: wss://csms-test.ivoracharge.com/hasura/v1/graphql
      NEXT_PUBLIC_CITRINE_CORE_URL: https://csms-test.ivoracharge.com/core-api
      # Google Maps: replace with your real keys from Google Cloud Console.
      # GOOGLE_MAPS_API_KEY = map rendering; GOOGLE_MAPS_ADDRESS_API_KEY = geocoding/address lookup.
      GOOGLE_MAPS_API_KEY: "AIzaSyDNIxJptezylHwTwvwJkxyoY0pD_z3DMEw"
      GOOGLE_MAPS_ADDRESS_API_KEY: "AIzaSyDNIxJptezylHwTwvwJkxyoY0pD_z3DMEw"

volumes:
  keycloak-data:
