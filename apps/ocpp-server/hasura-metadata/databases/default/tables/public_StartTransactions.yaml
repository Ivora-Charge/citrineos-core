table:
  name: StartTransactions
  schema: public
object_relationships:
- name: Connector
  using:
    foreign_key_constraint_on: connectorDatabaseId
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
- name: Transaction
  using:
    foreign_key_constraint_on: transactionDatabaseId
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - &id001
        _or:
        - connectorDatabaseId:
            _is_null: true
        - Connector:
            tenantId:
              _eq: x-hasura-tenant-id
      - &id002
        _or:
        - transactionDatabaseId:
            _is_null: true
        - Transaction:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
  comment: ''
- role: tenant-admin
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - connectorDatabaseId:
            _is_null: true
        - Connector:
            tenantId:
              _eq: x-hasura-tenant-id
      - _or:
        - transactionDatabaseId:
            _is_null: true
        - Transaction:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - *id001
      - *id002
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - connectorDatabaseId:
            _is_null: true
        - Connector:
            tenantId:
              _eq: x-hasura-tenant-id
      - _or:
        - transactionDatabaseId:
            _is_null: true
        - Transaction:
            tenantId:
              _eq: x-hasura-tenant-id
delete_permissions:
- role: user
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
