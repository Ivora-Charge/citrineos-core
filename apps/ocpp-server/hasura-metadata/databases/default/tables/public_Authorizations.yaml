table:
  name: Authorizations
  schema: public
object_relationships:
- name: GroupAuthorization
  using:
    foreign_key_constraint_on: groupAuthorizationId
- name: Tariff
  using:
    foreign_key_constraint_on: tariffId
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
- name: TenantPartner
  using:
    foreign_key_constraint_on: tenantPartnerId
array_relationships:
- name: Authorizations
  using:
    foreign_key_constraint_on:
      column: groupAuthorizationId
      table:
        name: Authorizations
        schema: public
- name: LocalListAuthorizations
  using:
    foreign_key_constraint_on:
      column: authorizationId
      table:
        name: LocalListAuthorizations
        schema: public
- name: Transactions
  using:
    foreign_key_constraint_on:
      column: authorizationId
      table:
        name: Transactions
        schema: public
- name: localListAuthorizationsByGroupauthorizationid
  using:
    foreign_key_constraint_on:
      column: groupAuthorizationId
      table:
        name: LocalListAuthorizations
        schema: public
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - &id001
        _or:
        - groupAuthorizationId:
            _is_null: true
        - GroupAuthorization:
            tenantId:
              _eq: x-hasura-tenant-id
      - &id002
        _or:
        - tariffId:
            _is_null: true
        - Tariff:
            tenantId:
              _eq: x-hasura-tenant-id
      - &id003
        _or:
        - tenantPartnerId:
            _is_null: true
        - TenantPartner:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
  comment: ''
- role: tenant-admin
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - groupAuthorizationId:
            _is_null: true
        - GroupAuthorization:
            tenantId:
              _eq: x-hasura-tenant-id
      - _or:
        - tariffId:
            _is_null: true
        - Tariff:
            tenantId:
              _eq: x-hasura-tenant-id
      - _or:
        - tenantPartnerId:
            _is_null: true
        - TenantPartner:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - *id001
      - *id002
      - *id003
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - groupAuthorizationId:
            _is_null: true
        - GroupAuthorization:
            tenantId:
              _eq: x-hasura-tenant-id
      - _or:
        - tariffId:
            _is_null: true
        - Tariff:
            tenantId:
              _eq: x-hasura-tenant-id
      - _or:
        - tenantPartnerId:
            _is_null: true
        - TenantPartner:
            tenantId:
              _eq: x-hasura-tenant-id
delete_permissions:
- role: user
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
