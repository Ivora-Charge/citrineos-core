table:
  name: Evses
  schema: public
object_relationships:
- name: ChargingStation
  using:
    foreign_key_constraint_on: stationId
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
array_relationships:
- name: ChargingNeeds
  using:
    foreign_key_constraint_on:
      column: evseId
      table:
        name: ChargingNeeds
        schema: public
- name: Connectors
  using:
    foreign_key_constraint_on:
      column: evseId
      table:
        name: Connectors
        schema: public
- name: Transactions
  using:
    foreign_key_constraint_on:
      column: evseId
      table:
        name: Transactions
        schema: public
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - &id001
        _or:
        - stationId:
            _is_null: true
        - ChargingStation:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
  comment: ''
- role: tenant-admin
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - stationId:
            _is_null: true
        - ChargingStation:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - *id001
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - stationId:
            _is_null: true
        - ChargingStation:
            tenantId:
              _eq: x-hasura-tenant-id
delete_permissions:
- role: user
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
