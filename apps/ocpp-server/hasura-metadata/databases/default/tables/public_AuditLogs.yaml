# Append-only audit trail written by operator-ui server actions via the admin
# secret (multi-tenant rollout Phase 3). Tenant admins may read their own
# tenant's entries; support has no direct customer-data access. No insert/update/delete
# for any JWT role -- writes go through the server-side admin secret only.
table:
  name: AuditLogs
  schema: public
select_permissions:
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
