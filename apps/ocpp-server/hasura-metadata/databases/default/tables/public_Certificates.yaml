table:
  name: Certificates
  schema: public
object_relationships:
- name: Certificate
  using:
    foreign_key_constraint_on: signedBy
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
array_relationships:
- name: Certificates
  using:
    foreign_key_constraint_on:
      column: signedBy
      table:
        name: Certificates
        schema: public
- name: InstallCertificateAttempts
  using:
    foreign_key_constraint_on:
      column: certificateId
      table:
        name: InstallCertificateAttempts
        schema: public
- name: InstalledCertificates
  using:
    foreign_key_constraint_on:
      column: certificateId
      table:
        name: InstalledCertificates
        schema: public
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - &id001
        _or:
        - signedBy:
            _is_null: true
        - Certificate:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
  comment: ''
- role: tenant-admin
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - signedBy:
            _is_null: true
        - Certificate:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - *id001
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - signedBy:
            _is_null: true
        - Certificate:
            tenantId:
              _eq: x-hasura-tenant-id
delete_permissions:
- role: user
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
