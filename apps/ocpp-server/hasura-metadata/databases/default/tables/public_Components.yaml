table:
  name: Components
  schema: public
object_relationships:
- name: EvseType
  using:
    foreign_key_constraint_on: evseDatabaseId
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
array_relationships:
- name: ComponentVariables
  using:
    foreign_key_constraint_on:
      column: componentId
      table:
        name: ComponentVariables
        schema: public
- name: EventData
  using:
    foreign_key_constraint_on:
      column: componentId
      table:
        name: EventData
        schema: public
- name: MessageInfos
  using:
    foreign_key_constraint_on:
      column: displayComponentId
      table:
        name: MessageInfos
        schema: public
- name: VariableAttributes
  using:
    foreign_key_constraint_on:
      column: componentId
      table:
        name: VariableAttributes
        schema: public
- name: VariableMonitorings
  using:
    foreign_key_constraint_on:
      column: componentId
      table:
        name: VariableMonitorings
        schema: public
insert_permissions:
- role: user
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - &id001
        _or:
        - evseDatabaseId:
            _is_null: true
        - EvseType:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
  comment: ''
- role: tenant-admin
  permission:
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - evseDatabaseId:
            _is_null: true
        - EvseType:
            tenantId:
              _eq: x-hasura-tenant-id
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - *id001
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      _and:
      - tenantId:
          _eq: x-hasura-tenant-id
      - _or:
        - evseDatabaseId:
            _is_null: true
        - EvseType:
            tenantId:
              _eq: x-hasura-tenant-id
delete_permissions:
- role: user
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
