table:
  name: ComponentVariables
  schema: public
object_relationships:
- name: Component
  using:
    foreign_key_constraint_on: componentId
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
- name: Variable
  using:
    foreign_key_constraint_on: variableId
insert_permissions:
- role: user
  permission:
    check:
      tenantId:
        _eq: x-hasura-tenant-id
    columns: '*'
  comment: ''
- role: tenant-admin
  permission:
    check:
      tenantId:
        _eq: x-hasura-tenant-id
    columns: '*'
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
update_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    check:
      tenantId:
        _eq: x-hasura-tenant-id
delete_permissions:
- role: user
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
  comment: ''
- role: tenant-admin
  permission:
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
