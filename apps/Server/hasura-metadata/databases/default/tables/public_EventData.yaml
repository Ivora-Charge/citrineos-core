table:
  name: EventData
  schema: public
object_relationships:
- name: ChargingStation
  using:
    foreign_key_constraint_on: stationId
- name: Component
  using:
    foreign_key_constraint_on: componentId
- name: Tenant
  using:
    foreign_key_constraint_on: tenantId
- name: Variable
  using:
    foreign_key_constraint_on: variableId
select_permissions:
- role: user
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
  comment: ''
- role: tenant-admin
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: tenant-viewer
  permission:
    columns: '*'
    filter:
      tenantId:
        _eq: x-hasura-tenant-id
    allow_aggregations: true
- role: platform-support
  permission:
    columns: '*'
    filter: {}
    allow_aggregations: true
